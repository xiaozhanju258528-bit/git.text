<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Crystal Heart</title>
<style>
  html, body { margin: 0; height: 100%; background: #05030c; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #c:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- 可调参数 ----------
const HEART_COUNT = 24000;   // 心脏点云数量：少而清晰，避免中心叠加成亮块
const AURA_COUNT  = 3200;    // 贴附心脏的光环粒子
const SPARK_COUNT = 4200;    // 环绕飞溅的粒子
const STAR_COUNT  = 1800;    // 背景星点
const BASE_SCALE  = 1.85;    // 心脏基础大小

// 粒子物理常数（运动学）
const SPARK_SPRING = 4.2;    // 弹簧拉回心脏表面
const SPARK_BURST  = 18.0;   // 心跳冲击外推强度（"坚强"的力量感）
const SPARK_SWIRL  = 1.6;    // 涡旋环绕
const SPARK_DAMP   = 1.2;    // 速度阻尼
const AURA_SPRING  = 16.0;
const AURA_BURST   = 5.0;
const AURA_SWIRL   = 0.6;
const AURA_DAMP    = 3.2;
const AURA_REST    = 0.32;   // 光环外偏移：与心脏表面拉开距离

// ---------- 渲染器 / 场景 ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.68;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05030c, 0.035);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0.2, 7.2);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 3.2;
controls.maxDistance = 16;

// ---------- 心形隐函数点云采样 ----------
// (x^2 + 9/4 y^2 + z^2 - 1)^3 - x^2 z^3 - 9/80 y^2 z^3 = 0，z 为竖直方向
function sampleHeart(count) {
  const pos = new Float32Array(count * 3);
  let n = 0, attempts = 0;
  const maxAttempts = count * 600;
  while (n < count && attempts < maxAttempts) {
    attempts++;
    const x = (Math.random() * 2 - 1) * 1.30;
    const y = (Math.random() * 2 - 1) * 1.30; // 深度
    const z = (Math.random() * 2 - 1) * 1.45; // 竖直
    const a = x * x + 2.25 * y * y + z * z - 1;
    const f = a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
    if (Math.abs(f) < 0.045) {
      pos[n * 3]     = x;
      pos[n * 3 + 1] = z;   // Three.js Y = z(上)
      pos[n * 3 + 2] = y;   // Three.js Z = y(深)
      n++;
    }
  }
  return pos.subarray(0, n * 3);
}
const heartPos = sampleHeart(HEART_COUNT);
const HN = heartPos.length / 3;

// ---------- 颜色工具 ----------
const STOPS = [
  [0.00, new THREE.Color('#ff4f86')],
  [0.30, new THREE.Color('#ff6ba0')],
  [0.60, new THREE.Color('#ff90c0')],
  [0.85, new THREE.Color('#ffc6e0')],
  [1.00, new THREE.Color('#fff4fa')],
];
const PRISM = ['#bff6ff', '#e7c8ff', '#fff0b8', '#c8fff2'].map(c => new THREE.Color(c));
function grad(t, out) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < STOPS.length; i++) {
    if (t <= STOPS[i][0]) {
      const a = STOPS[i - 1], b = STOPS[i];
      const k = (t - a[0]) / (b[0] - a[0]);
      out.copy(a[1]).lerp(b[1], k);
      return out;
    }
  }
  out.copy(STOPS[STOPS.length - 1][1]);
  return out;
}

// ---------- 共享着色器（圆点 + 发光 + 闪烁 + 心跳增强） ----------
const vert = `
  attribute float aSize;
  attribute vec3 aColor;
  attribute float aSeed;
  uniform float uPixelRatio;
  uniform float uTime;
  uniform float uBeat;
  uniform float uAlpha;
  uniform float uIsHeart;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vColor = aColor;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    // 脉冲式闪烁：永远为正，避免负透明度产生黑色脏点
    float pulse = 0.5 + 0.5 * sin(uTime * 2.1 + aSeed * 6.2831);
    float tw = 0.35 + 0.65 * pulse;
    // 心脏层在收缩期明显变透明；运动粒子层保持可见
    float beatAlpha = mix(1.0, 0.22 + 0.78 * uBeat, uIsHeart);
    vAlpha = tw * uAlpha * beatAlpha;
    float s = aSize * (1.0 + uBeat * 0.28);
    gl_PointSize = s * uPixelRatio * (44.0 / max(0.1, -mv.z));
    gl_Position = projectionMatrix * mv;
  }
`;
const frag = `
  varying vec3 vColor;
  varying float vAlpha;
  uniform float uBeat;
  void main() {
    float d = length(gl_PointCoord - vec2(0.5));
    if (d > 0.5) discard;
    float a = pow(1.0 - d * 2.0, 1.8);
    vec3 col = vColor * (0.7 + uBeat * 0.5);
    gl_FragColor = vec4(max(col, vec3(0.0)), clamp(a * vAlpha, 0.0, 1.0));
  }
`;
function makeMaterial({ alpha = 1, isHeart = false, additive = true } = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uPixelRatio: { value: renderer.getPixelRatio() },
      uTime: { value: 0 },
      uBeat: { value: 0 },
      uAlpha: { value: alpha },
      uIsHeart: { value: isHeart ? 1 : 0 },
    },
    vertexShader: vert,
    fragmentShader: frag,
    transparent: true,
    depthWrite: false,
      blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
  });
}
// 心脏用普通透明混合，避免数万点加色叠加把中心烧白
const heartMat = makeMaterial({ alpha: 0.5, isHeart: true, additive: false });
heartMat.depthWrite = true; // 只保留清晰的前排壳层，避免前后几十层粒子叠成亮雾
const fxMat = makeMaterial({ alpha: 0.55 });

function makeGeo(pos, col, size, seed) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  return g;
}

// ---------- 心脏主体 ----------
const heartGroup = new THREE.Group();
{
  const col = new Float32Array(HN * 3);
  const size = new Float32Array(HN);
  const seed = new Float32Array(HN);
  const c = new THREE.Color();
  for (let i = 0; i < HN; i++) {
    const y = heartPos[i * 3 + 1]; // 竖直
    const t = (y + 1.35) / 2.55;   // 归一化高度
    grad(t, c);
    if (Math.random() < 0.06) c.lerp(PRISM[(Math.random() * PRISM.length) | 0], 0.6); // 水晶棱镜闪光
    const j = (Math.random() - 0.5) * 0.12;
    c.r = Math.min(1, c.r + j); c.g = Math.min(1, c.g + j * 0.6); c.b = Math.min(1, c.b + j * 0.8);
    // 离中心轴越近越亮：中心突出，边缘收敛
    const ax = Math.hypot(heartPos[i * 3], heartPos[i * 3 + 2]);
    const cen = Math.max(0, 1 - ax / 1.25);
    c.r = Math.min(1, c.r * (1.0 + 0.5 * cen));
    c.g = Math.min(1, c.g * (1.0 + 0.5 * cen));
    c.b = Math.min(1, c.b * (1.0 + 0.5 * cen));
    c.convertSRGBToLinear();
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    size[i] = 1.9 + Math.random() * 1.8; // 统一大小，两端饱满
    seed[i] = Math.random();
  }
  const g = makeGeo(heartPos.slice(), col, size, seed);
  heartGroup.add(new THREE.Points(g, heartMat));
}
heartGroup.position.y = -0.08;
scene.add(heartGroup);

// helper：取心脏点（单位坐标）
function hp(i, out) { out.x = heartPos[i*3]; out.y = heartPos[i*3+1]; out.z = heartPos[i*3+2]; return out; }
const _a = new THREE.Vector3(), _o = new THREE.Vector3(), _t = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
const heartScale = new THREE.Vector3().setScalar(BASE_SCALE);

// ---------- 光环粒子（紧贴心脏的光晕，随心跳外鼓） ----------
const aura = (() => {
  const pos = new Float32Array(AURA_COUNT * 3);
  const col = new Float32Array(AURA_COUNT * 3);
  const base = new Float32Array(AURA_COUNT);
  const size = new Float32Array(AURA_COUNT);
  const seed = new Float32Array(AURA_COUNT);
  const vel = new Float32Array(AURA_COUNT * 3);
  const anchor = new Uint32Array(AURA_COUNT);
  const rest = new Float32Array(AURA_COUNT);
  const c = new THREE.Color();
  for (let i = 0; i < AURA_COUNT; i++) {
    anchor[i] = (Math.random() * HN) | 0;
    hp(anchor[i], _a);
    _o.copy(_a).normalize();
    rest[i] = AURA_REST + Math.random() * 0.32;
    pos[i*3]   = _a.x * BASE_SCALE + _o.x * rest[i];
    pos[i*3+1] = _a.y * BASE_SCALE + _o.y * rest[i];
    pos[i*3+2] = _a.z * BASE_SCALE + _o.z * rest[i];
    grad(0.7 + Math.random() * 0.3, c);
    c.convertSRGBToLinear();
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    base[i] = 1.6 + Math.random() * 2.2;
    size[i] = base[i];
    seed[i] = Math.random();
  }
  const g = makeGeo(pos, col, size, seed);
  const pts = new THREE.Points(g, fxMat);
  return { pts, pos, vel, anchor, rest, base, size, g };
})();
scene.add(aura.pts);

// ---------- 飞溅粒子（环绕心脏，心跳时被强力推出再被拉回，带涡旋） ----------
const spark = (() => {
  const pos = new Float32Array(SPARK_COUNT * 3);
  const col = new Float32Array(SPARK_COUNT * 3);
  const base = new Float32Array(SPARK_COUNT);
  const size = new Float32Array(SPARK_COUNT);
  const seed = new Float32Array(SPARK_COUNT);
  const vel = new Float32Array(SPARK_COUNT * 3);
  const anchor = new Uint32Array(SPARK_COUNT);
  const rest = new Float32Array(SPARK_COUNT);
  const life = new Float32Array(SPARK_COUNT);
  const maxLife = new Float32Array(SPARK_COUNT);
  const c = new THREE.Color();
  function spawn(i) {
    anchor[i] = (Math.random() * HN) | 0;
    hp(anchor[i], _a);
    _o.copy(_a).normalize();
    rest[i] = 0.38 + Math.random() * 0.92; // 每颗粒子有独立静止半径，收缩时不会堆回中心
    const r = rest[i];
    pos[i*3]   = _a.x * BASE_SCALE + _o.x * r;
    pos[i*3+1] = _a.y * BASE_SCALE + _o.y * r;
    pos[i*3+2] = _a.z * BASE_SCALE + _o.z * r;
    vel[i*3] = _o.x * 0.6; vel[i*3+1] = _o.y * 0.6; vel[i*3+2] = _o.z * 0.6;
    maxLife[i] = 2.2 + Math.random() * 3.0;
    life[i] = maxLife[i];
  }
  for (let i = 0; i < SPARK_COUNT; i++) {
    spawn(i);
    grad(0.4 + Math.random() * 0.55, c);
    if (Math.random() < 0.12) c.lerp(PRISM[(Math.random() * PRISM.length) | 0], 0.7);
    c.convertSRGBToLinear();
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    base[i] = 1.8 + Math.random() * 2.0;
    size[i] = base[i];
    seed[i] = Math.random();
  }
  const g = makeGeo(pos, col, size, seed);
  const pts = new THREE.Points(g, fxMat);
  return { pts, pos, vel, anchor, rest, life, maxLife, base, size, g, spawn };
})();
scene.add(spark.pts);

// ---------- 背景星点 ----------
{
  const pos = new Float32Array(STAR_COUNT * 3);
  const col = new Float32Array(STAR_COUNT * 3);
  const size = new Float32Array(STAR_COUNT);
  const seed = new Float32Array(STAR_COUNT);
  const c = new THREE.Color();
  for (let i = 0; i < STAR_COUNT; i++) {
    const r = 22 + Math.random() * 40;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
    pos[i*3+2] = r * Math.cos(ph);
    const hue = 0.55 + Math.random() * 0.2;
    c.setHSL(hue, 0.5, 0.6 + Math.random() * 0.3);
    c.convertSRGBToLinear();
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    size[i] = 0.5 + Math.random() * 0.9;
    seed[i] = Math.random();
  }
  scene.add(new THREE.Points(makeGeo(pos, col, size, seed), fxMat));
}

// ---------- 后处理辉光（水晶璀璨感） ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.45, 0.38);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- 心跳节律：lub-dub，双脉冲 ----------
function beatValue(t) {
  const T = 60 / 54; // 一次完整心动周期：54 BPM
  const p = (t % T) / T;
  const lub = Math.exp(-Math.pow((p - 0.06) / 0.045, 2));
  const dub = Math.exp(-Math.pow((p - 0.30) / 0.075, 2)) * 0.5;
  return Math.min(lub + dub, 1.15);
}

// ---------- 光环粒子物理 ----------
function updateAura(dt, b) {
  const s = heartScale.x;
  const dampF = Math.exp(-AURA_DAMP * dt);
  for (let i = 0; i < AURA_COUNT; i++) {
    const a = aura.anchor[i];
    hp(a, _a);
    _o.copy(_a).normalize();
    _t.set(_a.x * s + _o.x * aura.rest[i], _a.y * s + _o.y * aura.rest[i], _a.z * s + _o.z * aura.rest[i]);
    const px = aura.pos[i*3], py = aura.pos[i*3+1], pz = aura.pos[i*3+2];
    let ax = (_t.x - px) * AURA_SPRING + _o.x * (b * AURA_BURST);
    let ay = (_t.y - py) * AURA_SPRING + _o.y * (b * AURA_BURST);
    let az = (_t.z - pz) * AURA_SPRING + _o.z * (b * AURA_BURST);
    _a.set(px, py, pz).normalize();
    _a.crossVectors(UP, _a);
    if (_a.lengthSq() > 1e-4) { ax += _a.x * AURA_SWIRL; ay += _a.y * AURA_SWIRL; az += _a.z * AURA_SWIRL; }
    aura.vel[i*3]   = (aura.vel[i*3]   + ax * dt) * dampF;
    aura.vel[i*3+1] = (aura.vel[i*3+1] + ay * dt) * dampF;
    aura.vel[i*3+2] = (aura.vel[i*3+2] + az * dt) * dampF;
    aura.pos[i*3]   += aura.vel[i*3]   * dt;
    aura.pos[i*3+1] += aura.vel[i*3+1] * dt;
    aura.pos[i*3+2] += aura.vel[i*3+2] * dt;
    aura.size[i] = aura.base[i] * (1 + b * 0.4);
  }
}

// ---------- 飞溅粒子物理 ----------
function updateSpark(dt, b) {
  const s = heartScale.x;
  const dampF = Math.exp(-SPARK_DAMP * dt);
  for (let i = 0; i < SPARK_COUNT; i++) {
    const a = spark.anchor[i];
    hp(a, _a);
    _o.copy(_a).normalize();
    _t.set(_a.x * s + _o.x * spark.rest[i], _a.y * s + _o.y * spark.rest[i], _a.z * s + _o.z * spark.rest[i]);
    const px = spark.pos[i*3], py = spark.pos[i*3+1], pz = spark.pos[i*3+2];
    let ax = (_t.x - px) * SPARK_SPRING + _o.x * (b * SPARK_BURST);
    let ay = (_t.y - py) * SPARK_SPRING + _o.y * (b * SPARK_BURST);
    let az = (_t.z - pz) * SPARK_SPRING + _o.z * (b * SPARK_BURST);
    _a.set(px, py, pz).normalize();
    _a.crossVectors(UP, _a);
    if (_a.lengthSq() > 1e-4) { ax += _a.x * SPARK_SWIRL; ay += _a.y * SPARK_SWIRL; az += _a.z * SPARK_SWIRL; }
    spark.vel[i*3]   = (spark.vel[i*3]   + ax * dt) * dampF;
    spark.vel[i*3+1] = (spark.vel[i*3+1] + ay * dt) * dampF;
    spark.vel[i*3+2] = (spark.vel[i*3+2] + az * dt) * dampF;
    spark.pos[i*3]   += spark.vel[i*3]   * dt;
    spark.pos[i*3+1] += spark.vel[i*3+1] * dt;
    spark.pos[i*3+2] += spark.vel[i*3+2] * dt;
    spark.life[i] -= dt;
    const len2 = px*px + py*py + pz*pz;
    if (spark.life[i] <= 0 || len2 > 60) spark.spawn(i);
    const age = 1 - spark.life[i] / spark.maxLife[i];
    const env = Math.sin(Math.min(1, Math.max(0, age)) * Math.PI);
    spark.size[i] = spark.base[i] * env;
  }
}

// ---------- 主循环 ----------
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.033);
  const t = clock.elapsedTime;
  const b = beatValue(t);

  heartMat.uniforms.uTime.value = t;
  heartMat.uniforms.uBeat.value = b;
  fxMat.uniforms.uTime.value = t;
  fxMat.uniforms.uBeat.value = b;

  // 心脏随心跳缩放 + 整体缓慢自转
  heartScale.setScalar(BASE_SCALE * (1 + b * 0.24));
  heartGroup.scale.setScalar(BASE_SCALE * (1 + b * 0.24));
  heartGroup.rotation.y += dt * 0.05;

  updateAura(dt, b);
  updateSpark(dt, b);

  aura.g.attributes.position.needsUpdate = true;
  aura.g.attributes.aSize.needsUpdate = true;
  spark.g.attributes.position.needsUpdate = true;
  spark.g.attributes.aSize.needsUpdate = true;

  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

frame();
</script>
</body>
</html>
